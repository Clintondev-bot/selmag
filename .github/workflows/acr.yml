# CI: en cada push a main, construye las imágenes de SELMAG
# y las sube a Azure Container Registry (ACR).
#
# Configuración en GitHub (Settings > Secrets and variables > Actions):
#   Variable  ACR_LOGIN_SERVER  -> ej. selmagacr.azurecr.io
#   Secret    ACR_USERNAME      -> usuario administrador del ACR
#   Secret    ACR_PASSWORD      -> contraseña del ACR

name: Build y push a Azure Container Registry

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/acr.yml'
  workflow_dispatch:            # permite ejecutarlo a mano desde la pestaña Actions

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        servicio: [backend, frontend]   # se construyen las dos imágenes en paralelo
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Construir y subir selmag-${{ matrix.servicio }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.servicio }}
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/selmag-${{ matrix.servicio }}:latest
            ${{ vars.ACR_LOGIN_SERVER }}/selmag-${{ matrix.servicio }}:${{ github.sha }}
